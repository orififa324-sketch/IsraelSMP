<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IsraelSMP - Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Heebo',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  background:#0a0e1a;
  color:#fff;
}
.bg-particles{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
}
.bg-particles span{
  position:absolute;
  display:block;
  width:4px;height:4px;
  background:rgba(100,180,255,0.4);
  border-radius:0;
  animation:float linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh) rotate(0deg);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-10vh) rotate(720deg);opacity:0}
}
.container{
  position:relative;z-index:1;
  max-width:440px;width:90%;
  padding:40px 20px 50px;
  text-align:center;
}
.logo{
  width:220px;
  max-width:80%;
  margin-bottom:12px;
  animation:logoFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 0 25px rgba(60,140,255,0.5));
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
.subtitle{
  font-size:15px;
  color:rgba(180,210,255,0.7);
  margin-bottom:8px;
  letter-spacing:2px;
}
.server-ip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(60,140,255,0.12);
  border:1px solid rgba(60,140,255,0.3);
  border-radius:10px;
  padding:10px 22px;
  font-size:18px;
  font-weight:700;
  color:#7cb8ff;
  margin-bottom:36px;
  cursor:pointer;
  transition:all .3s;
  direction:ltr;
}
.server-ip:hover{
  background:rgba(60,140,255,0.25);
  border-color:rgba(60,140,255,0.6);
  transform:scale(1.03);
}
.server-ip .copy-icon{
  width:18px;height:18px;opacity:.6;transition:opacity .3s;
}
.server-ip:hover .copy-icon{opacity:1}
.server-ip .copied-msg{
  font-size:12px;color:#5eff8a;display:none;
}
.links{
  display:flex;flex-direction:column;gap:14px;
}
.link-btn{
  display:flex;align-items:center;gap:14px;
  padding:15px 22px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  text-decoration:none;
  color:#fff;
  font-size:17px;
  font-weight:700;
  transition:all .3s cubic-bezier(.25,.8,.25,1);
  direction:ltr;
}
.link-btn:hover{
  transform:translateY(-3px);
  background:rgba(60,140,255,0.15);
  border-color:rgba(60,140,255,0.4);
  box-shadow:0 8px 30px rgba(60,140,255,0.2);
}
.link-btn .icon{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  flex-shrink:0;
}
.link-btn .icon svg{width:24px;height:24px}
.link-btn span{flex:1;text-align:left;}
.link-discord .icon{background:rgba(88,101,242,0.2)}
.link-discord:hover{border-color:rgba(88,101,242,0.5)}
.link-store .icon{background:rgba(46,204,113,0.2)}
.link-store:hover{border-color:rgba(46,204,113,0.5)}
.link-youtube .icon{background:rgba(255,0,0,0.15)}
.link-youtube:hover{border-color:rgba(255,0,0,0.4)}
.link-tiktok .icon{background:rgba(255,255,255,0.1)}
.link-tiktok:hover{border-color:rgba(255,255,255,0.3)}
.link-instagram .icon{background:rgba(225,48,108,0.15)}
.link-instagram:hover{border-color:rgba(225,48,108,0.4)}
.footer{
  margin-top:40px;
  font-size:12px;
  color:rgba(255,255,255,0.25);
}
</style>
</head>
